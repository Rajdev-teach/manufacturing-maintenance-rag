name: Deploy Azure RAG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-rag-deployment
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python scripts/evaluate.py
      - run: az bicep build --file infra/main.bicep --outfile "$RUNNER_TEMP/azure-lab.json"

  build-and-deploy:
    needs: validate
    # configure-github.sh enables this only after provisioning and setting all secrets.
    if: vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      APP_SERVICE_NAME: ${{ secrets.APP_SERVICE_NAME }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment configuration
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          API_AUTH_TOKEN: ${{ secrets.API_AUTH_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, re
          required = ('AZURE_CREDENTIALS', 'ACR_LOGIN_SERVER', 'ACR_USERNAME', 'ACR_PASSWORD',
                      'APP_SERVICE_NAME', 'AZURE_RESOURCE_GROUP', 'API_AUTH_TOKEN')
          missing = [key for key in required if not os.getenv(key)]
          if missing:
              raise SystemExit('Missing configuration: ' + ', '.join(missing))
          credentials = json.loads(os.environ['AZURE_CREDENTIALS'])
          if not all(credentials.get(key) for key in ('clientId', 'clientSecret', 'tenantId', 'subscriptionId')):
              raise SystemExit('AZURE_CREDENTIALS is incomplete')
          if not re.fullmatch(r'[a-z0-9]+\.azurecr\.io', os.environ['ACR_LOGIN_SERVER']):
              raise SystemExit('Invalid ACR login server')
          PY
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
      - name: Choose immutable image tag
        id: image
        run: echo "name=$ACR_LOGIN_SERVER/rag-api:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            REQUIREMENTS_FILE=requirements-azure.txt
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Set runtime version
        run: |
          az webapp config appsettings set --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$APP_SERVICE_NAME" --settings "SERVICE_VERSION=$GITHUB_SHA" --output none
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.APP_SERVICE_NAME }}
          images: ${{ steps.image.outputs.name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-dotenv==1.0.1
      - name: Verify live deployment and capture response
        env:
          API_AUTH_TOKEN: ${{ secrets.API_AUTH_TOKEN }}
        run: |
          public_host="$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$APP_SERVICE_NAME" --query defaultHostName --output tsv)"
          python scripts/smoke_deployment.py --url "https://$public_host" --expected-commit "$GITHUB_SHA"
          python - <<'PY'
          import html, json
          from pathlib import Path
          report = Path('reports/azure-live/live-response.json')
          data = json.loads(report.read_text())
          evidence = '<!doctype html><meta charset="utf-8"><title>Verified Azure RAG response</title>'
          evidence += '<h1>Verified Azure RAG response</h1><pre style="white-space:pre-wrap;font:16px monospace">'
          evidence += html.escape(json.dumps(data, indent=2)) + '</pre>'
          report.with_suffix('.html').write_text(evidence)
          PY
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1440,1600 --virtual-time-budget=5000 \
            --screenshot="$PWD/reports/azure-live/live-response.png" \
            "file://$PWD/reports/azure-live/live-response.html"
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1440,1100 --virtual-time-budget=5000 \
            --screenshot="$PWD/reports/azure-live/fastapi-docs.png" "https://$public_host/docs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: azure-deployment-evidence
          path: reports/azure-live/
          if-no-files-found: warn
      - name: Log out
        if: always()
        run: az logout
